<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#181824" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="url(#glowGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <g filter="url(#glowFilter)" transform="translate(4, 4)">
    <circle cx="20" cy="20" r="16" stroke="url(#glowGrad)" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6" />
    <!-- Audio waves / AI brain pulses -->
    <rect x="10" y="16" width="3" height="8" rx="1.5" fill="url(#glowGrad)" />
    <rect x="15" y="11" width="3" height="18" rx="1.5" fill="url(#glowGrad)" />
    <rect x="20" y="8" width="3" height="24" rx="1.5" fill="url(#glowGrad)" />
    <rect x="25" y="13" width="3" height="14" rx="1.5" fill="url(#glowGrad)" />
    <rect x="30" y="17" width="3" height="6" rx="1.5" fill="url(#glowGrad)" />
  </g>
</svg>
